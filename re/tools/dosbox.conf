# Configuración determinista de dosbox-x para el oráculo de paridad (Task 0.3).
#
# Plantilla: oracle.py sustituye {GAME_DIR} por el directorio scratch con la
# copia del juego antes de lanzar dosbox-x. No editar los valores de máquina/
# CPU sin revisar re/notes/oracle.md: la paridad depende de que sean fijos.
#
# - machine=ega      : Ultima V es un juego de era EGA (EGA.DRV); tarjeta fija.
# - memsize=1        : 1 MB (640K convencionales), presupuesto de memoria fijo.
# - core=normal      : intérprete puro, sin dynarec (determinismo).
# - cycles=fixed 3000: CPU de velocidad fija (~XT/AT lenta pero suficiente);
#                      el tiempo emulado por instrucción no depende del host.
# - debuggerrun=debugger: DEBUGBOX pausa en el punto de entrada del programa
#                      y el debugger queda al mando (se maneja por pty).
# - nosound          : el audio no afecta al estado del juego y evita jitter.
# - quit warning=false: sin este ajuste, al cerrar dosbox-x con un programa
#                      corriendo (ULTIMA.EXE bajo DEBUGBOX, siempre) aparece
#                      el diálogo "Quit DOSBox-X warning ... No/Yes" que
#                      BLOQUEA la salida (incluso el `exit` del shell DOS se
#                      cuelga en él). Verificado en la build 2026.07.02.

[sdl]
output=surface

[dosbox]
machine=ega
memsize=1
saveremark=false
quit warning=false

[log]
debuggerrun=debugger

[render]
frameskip=0

[cpu]
core=normal
cycles=fixed 3000

[mixer]
nosound=true

[speaker]
pcspeaker=false

[autoexec]
mount c {GAME_DIR}
c:
{AUTOTYPE}
debugbox ULTIMA.EXE
